<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>הודעות</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      padding: 24px 16px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    #status { color: #94a3b8; font-size: 0.9rem; margin-bottom: 16px; min-height: 1.2em; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-bottom: 24px;
    }
    button:disabled { background: #334155; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      background: #1e293b;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    li.empty { text-align: center; color: #64748b; background: none; }
    .text { font-size: 1rem; margin-bottom: 4px; }
    .phone { font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
    .time { font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>
  <h1>הודעות</h1>
  <div id="status"></div>
  <button id="enable-btn">אפשר התראות</button>
  <ul id="messages"></ul>
  <script src="/app.js"></script>
</body>
</html>
