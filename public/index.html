<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>הודעות</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
    }
    header {
      padding: 16px 16px 8px;
      flex-shrink: 0;
    }
    h1 { font-size: 1.2rem; margin: 0 0 4px; }
    #status { color: #94a3b8; font-size: 0.85rem; min-height: 1.2em; }
    #enable-btn {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }
    #enable-btn:disabled { background: #334155; }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bubble {
      max-width: 78%;
      border-radius: 14px;
      padding: 10px 14px;
      line-height: 1.4;
    }
    .bubble .text { font-size: 1rem; white-space: pre-wrap; word-break: break-word; }
    .bubble .time { font-size: 0.7rem; color: #94a3b8; margin-top: 4px; }
    .bubble .sender { font-size: 0.75rem; color: #60a5fa; font-weight: 600; margin-bottom: 2px; }
    .bubble.in {
      align-self: flex-start;
      background: #1e293b;
      border-bottom-left-radius: 4px;
    }
    .bubble.out {
      align-self: flex-end;
      background: #3b82f6;
      border-bottom-right-radius: 4px;
    }
    .bubble.out .time { color: #dbeafe; }
    .empty { text-align: center; color: #64748b; margin-top: 24px; }

    #reply-form {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid #1e293b;
    }
    #reply-input {
      flex: 1;
      background: #1e293b;
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      color: #f1f5f9;
      font-size: 1rem;
    }
    #reply-input:focus { outline: 2px solid #3b82f6; }
    #reply-form button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 0 18px;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #reply-form button:disabled { background: #334155; }

    #contacts {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 0 16px 10px;
      flex-shrink: 0;
    }
    .contact {
      background: #1e293b;
      color: #f1f5f9;
      border: none;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
    }
    .contact.active { background: #3b82f6; }
    #chat-title { font-size: 0.9rem; color: #94a3b8; padding: 0 16px 4px; }

    #login-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      gap: 12px;
    }
    #login-screen h1 { text-align: center; margin-bottom: 8px; }
    #login-screen input {
      background: #1e293b;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      color: #f1f5f9;
      font-size: 1rem;
    }
    #login-screen button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1rem;
      cursor: pointer;
    }
    #login-screen button:disabled { background: #334155; }
    #login-error { color: #f87171; font-size: 0.85rem; min-height: 1.2em; text-align: center; }
    #app-screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
  </style>
</head>
<body>
  <div id="login-screen">
    <h1>התחברות</h1>
    <input id="login-username" type="text" placeholder="שם משתמש" autocomplete="username" />
    <input id="login-password" type="password" placeholder="סיסמה" autocomplete="current-password" />
    <div id="login-error"></div>
    <button id="login-btn">התחבר</button>
  </div>

  <div id="app-screen">
    <header>
      <h1>הודעות</h1>
      <div id="status"></div>
      <button id="enable-btn">אפשר התראות</button>
    </header>

    <div id="contacts"></div>
    <div id="chat-title"></div>
    <div id="chat"></div>

    <form id="reply-form">
      <input id="reply-input" type="text" placeholder="הקלד תשובה..." autocomplete="off" />
      <button type="submit">שלח</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
